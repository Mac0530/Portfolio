# Builds the React site on every push to main and publishes the result to the
# hostinger-deploy branch. Hostinger pulls that branch into public_html through
# its Git auto-deployment webhook.
name: Build and publish to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend_react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CI: false # don't fail the build on lint warnings
        run: npm run build

      - name: Publish build to the hostinger-deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger-deploy
          publish_dir: ./frontend_react/build
          commit_message: Deploy ${{ github.sha }}
